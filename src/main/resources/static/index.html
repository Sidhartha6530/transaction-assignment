<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Desk</title>
  <style>
    :root { --ink:#17221f; --muted:#64756f; --paper:#edf3f0; --panel:#fffefa; --line:#cbdad3; --green:#087c68; --deep:#123d35; --coral:#e66d52; --yellow:#f4c95d; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(135deg,#edf3f0 0%,#f8f3e8 65%,#e4efe9 100%); font-family:'Trebuchet MS',Verdana,sans-serif; }
    header { padding:28px 6vw 30px; display:flex; align-items:end; justify-content:space-between; background:var(--deep); color:#fff; border-bottom:5px solid var(--yellow); }
    .brand { display:flex; gap:15px; align-items:center; } .mark { width:46px; height:46px; display:flex; align-items:center; justify-content:center; color:var(--deep); background:#fff; border-radius:12px; font:bold 18px 'Trebuchet MS',sans-serif; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(18,61,53,0.08); } .mark img { width:100%; height:100%; object-fit:contain; display:block; background:transparent; padding:2px; }
    .eyebrow { margin:0 0 8px; color:var(--yellow); font:700 11px/1.2 Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,5vw,62px); line-height:.9; font-weight:700; letter-spacing:0; } .date { color:#b8d0c7; font:13px 'Trebuchet MS',sans-serif; }
    main { width:min(1180px,88vw); margin:34px auto 60px; } .intro { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:23px; } .intro p { margin:0; color:var(--muted); font:14px/1.5 Arial,sans-serif; }
    .stats { display:flex; gap:10px; } .stat { min-width:90px; padding:11px 13px; background:var(--panel); border:1px solid var(--line); } .stat strong { display:block; font-size:22px; font-weight:500; } .stat span { color:var(--muted); font:10px Arial,sans-serif; text-transform:uppercase; letter-spacing:1px; }
    .layout { display:grid; grid-template-columns:330px 1fr; gap:22px; align-items:start; } section { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 14px 28px #d7e2da; padding:25px; } h2 { margin:0 0 20px; font-size:24px; font-weight:700; letter-spacing:0; }
    .form-kicker { margin:-10px 0 17px; color:var(--muted); font:12px Arial,sans-serif; } label { display:block; margin:14px 0 6px; color:var(--muted); font:11px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    input,select { width:100%; border:1px solid #c1d1c9; background:#fff; border-radius:6px; padding:12px; color:var(--ink); font:15px 'Trebuchet MS',sans-serif; } input:focus,select:focus { outline:2px solid #9ed4c2; outline-offset:1px; }
    button { border:0; border-radius:6px; padding:12px 16px; cursor:pointer; font:700 11px 'Trebuchet MS',sans-serif; letter-spacing:0; text-transform:uppercase; transition:transform .15s, background .15s; } button:hover { transform:translateY(-2px); }
    .primary { width:100%; margin-top:20px; background:var(--green); color:#fff; } .primary:hover { background:var(--deep); } .secondary { background:#dcebe3; color:var(--green); }
    .toolbar { display:flex; gap:10px; margin-bottom:14px; } .toolbar input { flex:1; } .toolbar button { white-space:nowrap; } .activity-art { display:flex; align-items:center; margin:0 0 20px; padding:13px; background:#edf6ee; border-left:4px solid var(--yellow); } .activity-art p { margin:0; color:var(--deep); font:11px/1.35 Arial,sans-serif; text-transform:uppercase; letter-spacing:.7px; }
    table { width:100%; border-collapse:collapse; font-size:15px; } th { color:var(--muted); text-align:left; font:11px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; } th,td { padding:15px 10px; border-bottom:1px solid var(--line); } tbody tr { transition:background .15s; } tbody tr:hover { background:#f3f8f3; } td:first-child { color:var(--green); font-weight:bold; } .amount { text-align:right; }
    .status { display:inline-block; padding:5px 9px; border-radius:20px; font:10px Arial,sans-serif; letter-spacing:.5px; } .PENDING { background:#fff1c8; } .COMPLETED { background:#d8f0e5; color:#176047; } .FAILED,.CANCELLED { background:#f9dcd5; color:#9b3f2b; }
    .empty { padding:50px 10px; color:var(--muted); text-align:center; } .notice { min-height:20px; margin:13px 0 0; color:var(--coral); font:13px Arial,sans-serif; }
    @media (max-width:760px) { header { display:block; } .date { margin-top:20px; } main { width:min(92vw,600px); margin-top:24px; } .intro { display:block; } .stats { margin-top:16px; } .layout { grid-template-columns:1fr; } section { padding:18px; } table { min-width:620px; } .table-wrap { overflow-x:auto; } }
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark"><img src="/Toucan-Payments.jpg" alt="Toucan Payments logo"></div><div><h1>Toucan Payments - Transaction Proccessing Service</h1></div></div><div class="date" id="today"></div></header>
  <main><div class="intro"><p></p><div class="stats"><div class="stat"><strong id="total-count">0</strong><span>Transactions</span></div><div class="stat"><strong id="pending-count">0</strong><span>Pending</span></div></div></div><div class="layout">
    <section><h2>New transaction</h2><form id="create-form">
      <label for="customerId">Customer ID</label><input id="customerId" type="text" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" required title="Customer ID should be 00000001 to 99999998">
      <label for="amount">Amount</label><input id="amount" type="text" inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,2})?" maxlength="13" required title="Amount must be from 0.01 to 9999999999.99">
      <label for="currency">Currency</label><select id="currency" required title="Choose a country to use its currency code"><option value="" selected disabled>Choose a country</option><option value="USD">United States - USD</option><option value="CAD">Canada - CAD</option><option value="GBP">United Kingdom - GBP</option><option value="EUR">Germany - EUR</option><option value="EUR">France - EUR</option><option value="INR">India - INR</option><option value="JPY">Japan - JPY</option><option value="AUD">Australia - AUD</option><option value="NZD">New Zealand - NZD</option><option value="CHF">Switzerland - CHF</option><option value="CNY">China - CNY</option><option value="AED">United Arab Emirates - AED</option><option value="SAR">Saudi Arabia - SAR</option><option value="BRL">Brazil - BRL</option><option value="MXN">Mexico - MXN</option><option value="ZAR">South Africa - ZAR</option><option value="SGD">Singapore - SGD</option></select>
      <label for="transactionType">Transaction type</label><select id="transactionType" required><option value="" selected disabled>Choose transaction type</option><option value="DEPOSIT">DEPOSIT</option><option value="WITHDRAWAL">WITHDRAWAL</option><option value="TRANSFER">TRANSFER</option><option value="PAYMENT">PAYMENT</option></select>
      <button class="primary" type="submit">Create transaction</button><p class="notice" id="form-message"></p>
    </form></section>
    <section><h2>All transactions</h2><div class="toolbar"><input id="transaction-filter" type="text" pattern="TP[0-9]{10}" maxlength="12" placeholder="Filter by transaction ID"><input id="customer-filter" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="Filter by customer ID"><button class="secondary" id="refresh" type="button">Refresh</button></div>
      <div class="table-wrap"><table><thead><tr><th>Transaction ID</th><th>Customer ID</th><th class="amount">Amount</th><th>Currency</th><th>Transaction Type</th><th>Transaction Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div></main>
  <script>
    const rows = document.querySelector('#rows'), message = document.querySelector('#form-message');
    const customerId = document.querySelector('#customerId'), amount = document.querySelector('#amount');
    const currency = document.querySelector('#currency'), transactionType = document.querySelector('#transactionType');
    const supportedCurrencies = new Set(Intl.supportedValuesOf ? Intl.supportedValuesOf('currency') : ['USD', 'EUR', 'GBP', 'INR', 'JPY', 'CAD', 'AUD']);
    async function load() {
      const transactionId = document.querySelector('#transaction-filter').value.trim().toUpperCase();
      const customerId = document.querySelector('#customer-filter').value.trim();
      if (transactionId && transactionId.length !== 12) return;
      if (customerId && customerId.length !== 8) return;
      const url = transactionId ? `/api/transactions/${transactionId}` : customerId ? `/api/transactions/customer/${customerId}` : '/api/transactions';
      try {
        const response = await fetch(url);
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `Transaction not found (${response.status})`);
        }
        const result = await response.json();
        const transactions = Array.isArray(result) ? result : [result];
        render(customerId && transactionId ? transactions.filter(transaction => String(transaction.customerId) === customerId) : transactions);
      } catch (error) {
        rows.innerHTML = `<tr><td colspan="7" class="empty">${error.message}</td></tr>`;
      }
    }
    function render(transactions) { document.querySelector('#total-count').textContent = transactions.length; document.querySelector('#pending-count').textContent = transactions.filter(transaction => transaction.transactionStatus === 'PENDING').length; rows.innerHTML = transactions.length ? transactions.map(transaction => `<tr><td>${transaction.transactionId}</td><td>${String(transaction.customerId).padStart(8, '0')}</td><td class="amount">${Number(transaction.amount).toFixed(2)}</td><td>${transaction.currency}</td><td>${transaction.transactionType}</td><td><span class="status ${transaction.transactionStatus}">${transaction.transactionStatus}</span></td><td><select data-id="${transaction.transactionId}" aria-label="Change status" ${transaction.transactionStatus === 'PENDING' ? '' : 'disabled title="Terminal transactions are immutable"'}><option value="">Select</option><option>COMPLETED</option><option>FAILED</option><option>CANCELLED</option></select></td></tr>`).join('') : '<tr><td colspan="7" class="empty">No transaction found</td></tr>'; }
    customerId.addEventListener('input', () => { customerId.value = customerId.value.replace(/\D/g, '').slice(0, 8); const validCustomerId = /^\d{8}$/.test(customerId.value) && Number(customerId.value) >= 1 && Number(customerId.value) <= 99999998; customerId.setCustomValidity(validCustomerId ? '' : 'Customer ID should be 00000001 to 99999998'); }); amount.addEventListener('input', () => { const parts = amount.value.replace(/[^\d.]/g, '').split('.'); amount.value = parts[0].slice(0, 10) + (parts.length > 1 ? `.${parts[1].slice(0, 2)}` : ''); const validAmount = /^\d+(\.\d{1,2})?$/.test(amount.value) && Number(amount.value) >= 0.01 && Number(amount.value) <= 9999999999.99; amount.setCustomValidity(validAmount ? '' : 'Amount must be greater than 0'); }); amount.addEventListener('invalid', () => { if (!amount.value) amount.setCustomValidity('Please enter the amount'); }); currency.addEventListener('invalid', () => { if (!currency.value) currency.setCustomValidity('Please select the currency'); }); currency.addEventListener('change', () => currency.setCustomValidity('')); transactionType.addEventListener('invalid', () => { if (!transactionType.value) transactionType.setCustomValidity('Please select the transaction type'); }); transactionType.addEventListener('change', () => transactionType.setCustomValidity(''));
    document.querySelector('#create-form').addEventListener('submit', async event => { event.preventDefault(); message.textContent = ''; const form = event.target; if (!form.reportValidity()) return; const currencyCode = currency.value.trim().toUpperCase(); if (!supportedCurrencies.has(currencyCode)) { message.style.color = 'var(--coral)'; message.textContent = 'Enter a valid ISO-4217 currency code.'; return; } const payload = { customerId:Number(customerId.value), amount:Number(amount.value), currency:currencyCode, transactionType:transactionType.value }; try { const response = await fetch('/api/transactions', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }); if (!response.ok) throw new Error('Please check the transaction details.'); form.reset(); message.style.color = 'var(--green)'; message.textContent = 'Transaction created successfully.'; load(); } catch (error) { message.style.color = 'var(--coral)'; message.textContent = error.message; } });
    rows.addEventListener('change', async event => { if (!event.target.dataset.id || !event.target.value) return; const selectedStatus = event.target.value; try { const response = await fetch(`/api/transactions/${event.target.dataset.id}/status?status=${selectedStatus}`, { method:'PUT' }); const payload = await response.text(); if (!response.ok) { throw new Error(payload || (response.status === 409 ? 'This transaction cannot change status.' : 'Status update failed.')); } message.style.color = 'var(--green)'; message.textContent = `Status updated to ${selectedStatus}.`; load(); } catch (error) { event.target.value = ''; message.style.color = 'var(--coral)'; message.textContent = error.message; } });
    document.querySelector('#refresh').addEventListener('click', () => {
      document.querySelector('#transaction-filter').value = '';
      document.querySelector('#customer-filter').value = '';
      load();
    });
    document.querySelector('#transaction-filter').addEventListener('input', event => { event.target.value = event.target.value.toUpperCase(); if (event.target.value.length === 0 || event.target.value.length === 12) load(); }); document.querySelector('#customer-filter').addEventListener('input', event => { event.target.value = event.target.value.replace(/\D/g, '').slice(0, 8); if (event.target.value.length === 0 || event.target.value.length === 8) load(); }); document.querySelector('#today').textContent = new Intl.DateTimeFormat('en', { dateStyle:'full' }).format(new Date()); load();
  </script>
</body>
</html>
